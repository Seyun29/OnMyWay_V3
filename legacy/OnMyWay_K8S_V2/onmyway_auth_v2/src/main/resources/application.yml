spring:
  cloud:
    gateway:
      mvc:
        routes:
          - id: proxy_route
            uri: http://localhost:80
            predicates:
              - Path=/map/**
  config:
    activate:
      on-profile: local

  jwt:
    secret: "<MASKED_JWT_SECRET>"

  datasource:
    url: "jdbc:mysql://localhost:3306/onmyway"
    username: "root"
    password: "<MASKED_DB_PASSWORD>"
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none

    properties:
      hibernate:
        show_sql: true
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
---
spring:
  config:
    activate:
      on-profile: prod

  cloud:
    gateway:
      mvc:
        routes:
          - id: proxy_routes
            uri: http://${ONMYWAY_API_SERVICE_HOST}:8080
            predicates:
              - Path=/map/**

  jwt:
    secret: "<MASKED_JWT_SECRET>"

  datasource:
    url: "jdbc:mysql://<MASKED_DB_HOST>:3306/onmyway"
    username: "admin"
    password: "<MASKED_DB_PASSWORD>" #FIXME: fix this security issue
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none

    properties:
      hibernate:
        show_sql: true
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
