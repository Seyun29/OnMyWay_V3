# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# AndroidX is required by React Native and the native map SDKs.
android.useAndroidX=true

# Architectures included in local and release builds.
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# React Native 0.86 uses the New Architecture and Hermes.
newArchEnabled=true
hermesEnabled=true

# Keep edge-to-edge opt-in until every screen is verified on Android 15/16.
edgeToEdgeEnabled=false

# Release signing credentials are stored in ~/.gradle/gradle.properties.
